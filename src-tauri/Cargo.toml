[package]
name = "fileflow"
version = "0.4.2"
description = "Watch SD cards and Lightroom exports; ingest photos and import to Apple Photos."
authors = ["Guillaume Lemer"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows quirk).
name = "fileflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
fileflow-core = { path = "../core" }
notify = "6"
chrono.workspace = true
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
serde.workspace = true
serde_json.workspace = true

# GetLogicalDrives/GetDriveTypeW keep the 5s drive poll off PowerShell.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }

# diskutil plist parsing only exists on the macOS volume path.
[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[dev-dependencies]
tempfile = "3"
